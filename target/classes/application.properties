# Dana Player Configuration
server.port=8080

# Path to the folder containing .dana files
# Change this to your actual folder path
dana.music.folder=./music

# Circular buffer configuration
dana.buffer.capacity=32
# Chunk size in bytes: 4096 bytes = ~23ms of audio at 44100Hz/16bit/stereo
dana.buffer.chunk-size=4096

# WebSocket configuration
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536
