<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dana Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Unbounded:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══ TITLE BAR ══════════════════════════════════════════════ -->
<header class="titlebar">
    <div class="titlebar-drag"></div>
    <div class="titlebar-brand">
        <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="0,14 7,0 14,14" fill="var(--accent)"/></svg>
        DANA
    </div>
    <div class="titlebar-controls">
        <button class="tb-btn tb-min" id="tb-min"></button>
        <button class="tb-btn tb-max" id="tb-max"></button>
        <button class="tb-btn tb-close" id="tb-close"></button>
    </div>
</header>

<!-- ══ APP BODY ═══════════════════════════════════════════════ -->
<div class="app-body">

    <!-- ── SIDEBAR ─────────────────────────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="folder-btn" id="folder-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Open Folder
            </button>
            <div class="folder-info">
                <span class="folder-path" id="folder-path">no folder selected</span>
                <span class="folder-count" id="folder-count"></span>
            </div>
            <div class="pl-controls">
                <div class="pl-controls-row">
                    <button id="pl-new-btn">+ New Playlist</button>
                </div>
                <div class="pl-select-wrap">
                    <select id="pl-select">
                        <option value="">— All Tracks —</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="playlist-wrap">
            <div class="playlist-header-row">
                <span class="section-label" id="pl-section-label">LIBRARY</span>
                <span class="pl-active-badge" id="pl-active-badge"></span>
            </div>
            <ul class="playlist" id="playlist">
                <li class="pl-empty" id="pl-empty">
                    <div class="pl-empty-icon">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    </div>
                    <p>No audio files found</p>
                    <small>Open a folder to begin</small>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <div class="daemon-status">
                <span class="daemon-dot" id="daemon-dot"></span>
                <span id="daemon-text">connecting…</span>
            </div>
        </div>
    </aside>

    <!-- ── MAIN STAGE ──────────────────────────────────────── -->
    <main class="stage">

        <!-- Volume: absolute top-right of stage -->
        <div class="vol-wrap">
            <div class="vol-icon-wrap">
                <svg class="vol-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
            </div>
            <div class="vol-track-wrap">
                <input class="vol-slider" id="vol-slider" type="range" min="0" max="200" value="100" step="1">
                <div class="vol-fill" id="vol-fill"></div>
            </div>
            <span class="vol-value" id="vol-value">100</span>
        </div>

        <!-- Vinyl + track info -->
        <section class="now-playing">
            <div class="vinyl-container" id="vinyl-container">
                <!-- Cover image (shown when track has art) -->
                <img class="vinyl-record" id="cover-img" src="" alt="" style="display:none">
                <!-- Placeholder (shown when no art) -->
                <div class="cover-placeholder vinyl-record" id="cover-placeholder">
                    <svg class="vinyl-grooves" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="150" cy="150" r="138" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
                        <circle cx="150" cy="150" r="128" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
                        <circle cx="150" cy="150" r="108" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="98"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
                        <circle cx="150" cy="150" r="88"  fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="78"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="68"  fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="58"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
                        <circle cx="150" cy="150" r="48"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
                        <circle cx="150" cy="150" r="38"  fill="rgba(30,30,40,0.9)"/>
                        <circle cx="150" cy="150" r="28"  fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="6"   fill="rgba(12,12,15,1)"/>
                        <circle cx="150" cy="150" r="34"  fill="none" stroke="rgba(232,255,71,0.08)" stroke-width="1"/>
                    </svg>
                </div>
                <!-- Tonearm SVG -->
                <div class="tonearm-wrap" id="tonearm-wrap">
                    <svg class="tonearm-svg" viewBox="0 0 80 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                        <defs>
                            <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%"   stop-color="#2a2a34"/>
                                <stop offset="30%"  stop-color="#6e6e80"/>
                                <stop offset="50%"  stop-color="#9898aa"/>
                                <stop offset="70%"  stop-color="#6e6e80"/>
                                <stop offset="100%" stop-color="#2a2a34"/>
                            </linearGradient>
                            <radialGradient id="pivotGrad" cx="38%" cy="30%" r="60%">
                                <stop offset="0%"   stop-color="#d0d0de"/>
                                <stop offset="50%"  stop-color="#7a7a8e"/>
                                <stop offset="100%" stop-color="#30303c"/>
                            </radialGradient>
                            <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%"   stop-color="#888898"/>
                                <stop offset="100%" stop-color="#404050"/>
                            </linearGradient>
                            <filter id="armShadow" x="-30%" y="-10%" width="160%" height="130%">
                                <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
                            </filter>
                        </defs>
                        <rect x="35" y="12" width="10" height="142" rx="4" ry="4" fill="url(#armGrad)" filter="url(#armShadow)"/>
                        <rect x="28" y="148" width="24" height="12" rx="3" ry="3" fill="url(#armGrad)" transform="rotate(-12, 40, 154)"/>
                        <rect x="14" y="158" width="30" height="22" rx="4" ry="4" fill="url(#headGrad)" transform="rotate(-12, 29, 169)"/>
                        <line x1="26" y1="184" x2="26" y2="196" stroke="#b0b0c4" stroke-width="1.5" stroke-linecap="round" transform="rotate(-12, 26, 184)"/>
                        <circle cx="40" cy="10" r="9" fill="url(#pivotGrad)" filter="url(#armShadow)"/>
                        <circle cx="40" cy="10" r="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                    </svg>
                </div>
            </div>

            <div class="np-info">
                <div class="np-state"  id="np-state">STOPPED</div>
                <h2 class="np-title"   id="np-title">Dana Player</h2>
                <div class="np-artist" id="np-artist">—</div>
                <div class="np-album"  id="np-album"></div>
            </div>
        </section>

        <!-- Progress bar -->
        <div class="progress-wrap">
            <span class="time-el" id="time-elapsed">0:00</span>
            <div class="progress-track" id="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time-el" id="time-total">0:00</span>
        </div>

        <!-- Transport controls -->
        <nav class="transport">
            <button class="tp-btn tp-prev" id="tp-prev" title="Previous [←]">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="tp-btn tp-play" id="tp-play" title="Play / Pause [Space]">
                <svg class="ico-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="ico-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
            </button>
            <button class="tp-btn tp-next" id="tp-next" title="Next [→]">
                <svg viewBox="0 0 24 24"><path d="m5 18 8.5-6L5 6v12zm2-9.33L10.48 12 7 14.33V8.67zM16 6h2v12h-2z"/></svg>
            </button>
            <button class="tp-btn tp-loop" id="tp-loop" title="Loop [L]" data-on="false">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </nav>

        <!-- Status row -->
        <div class="status-row">
            <button class="sr-lyrics-btn" id="sr-lyrics-btn" title="Show lyrics">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="2" width="6" height="11" rx="3"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                    <line x1="8"  y1="22" x2="16" y2="22"/>
                </svg>
            </button>
            <span class="sr-item" id="sr-codec">DANA LOSSLESS</span>
            <span class="sr-sep">·</span>
            <span class="sr-item" id="sr-fmt">—</span>
        </div>

    </main><!-- /.stage -->

    <!-- ── LYRICS PANEL ────────────────────────────────────── -->
    <aside class="lyrics-panel" id="lyrics-wrap" style="display:none">
        <div class="lyrics-header">
            <span class="section-label">LYRICS</span>
            <button class="lyrics-close" id="lyrics-close">✕</button>
        </div>
        <div class="lyrics-body" id="lyrics-body"></div>
    </aside>

</div><!-- /.app-body -->

<!-- ── PLAYLIST MODAL ─────────────────────────────────────── -->
<div id="playlist-modal" class="modal-overlay" style="display:none">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3>New Playlist</h3>
            <button class="modal-close" id="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">
            <input type="text" id="modal-playlist-name" placeholder="Enter playlist name..." maxlength="50" autocomplete="off">
        </div>
        <div class="modal-footer">
            <button class="modal-btn modal-cancel" id="modal-cancel-btn">Cancel</button>
            <button class="modal-btn modal-create" id="modal-create-btn">Create</button>
        </div>
    </div>
</div>

<!-- ── EQ Button + Panel (fixed, outside app-body intentionally) ── -->
<button id="eq-btn" title="Equalizer">EQ</button>

<div id="eq-panel" style="display:none">
    <div class="eq-band">
        <label>60Hz</label>
        <input type="range" id="eq-60"  min="-12" max="12" value="0" orient="vertical">
    </div>
    <div class="eq-band">
        <label>250Hz</label>
        <input type="range" id="eq-250" min="-12" max="12" value="0" orient="vertical">
    </div>
    <div class="eq-band">
        <label>1kHz</label>
        <input type="range" id="eq-1k"  min="-12" max="12" value="0" orient="vertical">
    </div>
    <div class="eq-band">
        <label>4kHz</label>
        <input type="range" id="eq-4k"  min="-12" max="12" value="0" orient="vertical">
    </div>
    <div class="eq-band">
        <label>16kHz</label>
        <input type="range" id="eq-16k" min="-12" max="12" value="0" orient="vertical">
    </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
