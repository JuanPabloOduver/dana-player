<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dana Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div class="app-shell">

        <!-- ══ SIDEBAR ══════════════════════════════════════════ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-mark">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="1" y="1" width="26" height="26" rx="4" stroke="var(--accent)" stroke-width="1.5"/>
                        <path d="M7 14 L12 8 L17 14 L12 20 Z" fill="var(--accent)" opacity="0.8"/>
                        <circle cx="19" cy="14" r="3" fill="var(--accent)"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">DANA</span>
                    <span class="logo-sub">PLAYER</span>
                </div>
            </div>

            <div class="folder-label">
                <span class="folder-icon">◈</span>
                <span id="folder-path" class="folder-path">loading...</span>
            </div>

            <div class="playlist-header">
                <span>LIBRARY</span>
                <span id="track-count" class="track-count">—</span>
            </div>

            <ul class="playlist" id="playlist">
                <li class="playlist-empty">
                    <span class="empty-icon">⬡</span>
                    <span>No .dana files found</span>
                    <span class="empty-hint">Drop files in the music folder</span>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="codec-badge">
                    <span class="codec-dot"></span>
                    LOSSLESS · PCM 44.1kHz
                </div>
            </div>
        </aside>

        <!-- ══ MAIN AREA ════════════════════════════════════════ -->
        <main class="main-area">

            <!-- Visualizer canvas -->
            <div class="visualizer-container">
                <canvas id="visualizer" class="visualizer"></canvas>
                <div class="visualizer-label" id="visualizer-label">IDLE</div>
            </div>

            <!-- Now Playing -->
            <div class="now-playing-area">
                <div class="track-info">
                    <div class="track-status" id="track-status">—</div>
                    <h1 class="track-name" id="track-name">No track selected</h1>
                    <div class="track-meta" id="track-meta">Select a track from the library</div>
                </div>

                <!-- Buffer indicator -->
                <div class="buffer-bar-wrapper" title="Buffer fill level">
                    <div class="buffer-bar-label">BUFFER</div>
                    <div class="buffer-bar-track">
                        <div class="buffer-bar-fill" id="buffer-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Transport Controls -->
            <div class="transport">
                <button class="transport-btn btn-prev" id="btn-prev" title="Previous">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button class="transport-btn btn-play" id="btn-play" title="Play/Pause">
                    <svg class="icon-play" viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" width="28" height="28" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <button class="transport-btn btn-next" id="btn-next" title="Next">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zm2.5-6l5.5 4V8z" /><rect x="16" y="6" width="2" height="12"/></svg>
                </button>

                <button class="transport-btn btn-loop" id="btn-loop" title="Loop" data-active="false">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>

            <!-- Connection status -->
            <div class="connection-status" id="connection-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting…</span>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
